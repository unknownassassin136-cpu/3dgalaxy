<!-- ADMIN CATEGORIES -->
<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <h3>Overview</h3>
    <nav class="admin-nav mb-3"><a href="#!/admin"><i class="fas fa-home"></i> Dashboard</a></nav>
    <h3>Catalog</h3>
    <nav class="admin-nav mb-3">
      <a href="#!/admin/products"><i class="fas fa-box"></i> Products</a>
      <a href="#!/admin/categories" class="active"><i class="fas fa-tags"></i> Categories</a>
    </nav>
    <h3>Sales</h3>
    <nav class="admin-nav mb-3">
      <a href="#!/admin/orders"><i class="fas fa-shopping-cart"></i> Orders</a>
      <a href="#!/admin/coupons"><i class="fas fa-ticket-alt"></i> Coupons</a>
    </nav>
    <h3>People</h3>
    <nav class="admin-nav"><a href="#!/admin/users"><i class="fas fa-users"></i> Users</a></nav>
  </aside>

  <!-- Content -->
  <main class="admin-content">
    <div class="admin-header">
      <h1>Product Categories</h1>
      <button class="btn btn-primary" ng-click="openAdd()"><i class="fas fa-plus"></i> Add Category</button>
    </div>

    <div class="page-loader" ng-show="loading"><div class="spinner"></div></div>

    <div class="data-table-container animate-fade-in-up" ng-hide="loading">
      <table class="data-table">
        <thead>
          <tr>
            <th>Category</th>
            <th>Slug</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr ng-repeat="c in categories">
            <td>
              <div class="product-cell">
                <div class="product-thumb"><img ng-src="{{c.image}}" alt="{{c.name}}" ng-if="c.image"></div>
                <div style="font-weight:600;">{{c.name}}</div>
              </div>
            </td>
            <td><code>{{c.slug}}</code></td>
            <td><span class="badge" ng-class="c.isActive ? 'badge-new' : 'badge-danger'">{{c.isActive ? 'Active' : 'Hidden'}}</span></td>
            <td>{{c.createdAt | date:'MMM dd, yyyy'}}</td>
            <td>
              <button class="btn btn-icon btn-sm" style="color:var(--info);" ng-click="openEdit(c)"><i class="fas fa-edit"></i></button>
              <button class="btn btn-icon btn-sm" style="color:var(--danger);" ng-click="deleteCategory(c)"><i class="fas fa-trash-alt"></i></button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" ng-show="showModal">
      <div class="modal">
        <div class="modal-header">
          <h2>{{editMode ? 'Edit Category' : 'Add Category'}}</h2>
          <button class="modal-close" ng-click="showModal = false"><i class="fas fa-times"></i></button>
        </div>
        <form ng-submit="saveCategory()">
          <div class="form-group">
            <label>Name *</label>
            <input type="text" class="form-control" ng-model="form.name" ng-change="!editMode && generateSlug()" required>
          </div>
          <div class="form-group">
            <label>Slug *</label>
            <input type="text" class="form-control" ng-model="form.slug" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea class="form-control" rows="3" ng-model="form.description"></textarea>
          </div>
          <div class="form-group">
            <label>Image URL</label>
            <input type="url" class="form-control" ng-model="form.image" placeholder="https://...">
            <div ng-if="form.image" style="margin-top:10px;">
              <img ng-src="{{form.image}}" style="height:100px; border-radius:8px; object-fit:cover;">
            </div>
          </div>
          <div class="form-group">
            <label class="filter-option">
              <input type="checkbox" ng-model="form.isActive"> Is Active
            </label>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px;">
            <button type="button" class="btn btn-outline" ng-click="showModal = false">Cancel</button>
            <button type="submit" class="btn btn-primary">{{editMode ? 'Update' : 'Save'} Category</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
