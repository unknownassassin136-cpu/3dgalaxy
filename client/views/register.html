<!-- REGISTER PAGE -->
<div class="auth-page">
  <div class="auth-card animate-fade-in-up">
    <h2>Create Account</h2>
    <p class="auth-subtitle">Join the 3D Galaxy family</p>

    <form ng-submit="submit()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" class="form-control" ng-model="formData.name" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-control" ng-model="formData.email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" class="form-control" ng-model="formData.phone" placeholder="+91 9876543210">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" ng-model="formData.password" placeholder="Minimum 6 characters" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg" ng-disabled="loading">
        <i class="fas" ng-class="{'fa-spinner fa-spin': loading, 'fa-user-plus': !loading}"></i>
        {{loading ? 'Creating...' : 'Create Account'}}
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="#!/login">Sign in</a>
    </div>
  </div>
</div>
